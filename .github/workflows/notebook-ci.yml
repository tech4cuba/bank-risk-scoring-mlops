name: ML Notebook CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-validation:
    name: Validate data and scoring notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install testing dependency
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Run notebook integrity and scoring checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
