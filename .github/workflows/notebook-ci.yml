name: MLOps CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-validation:
    name: Validate data and scoring notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notebook test dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4

      - name: Run notebook integrity checks
        run: python -m unittest discover -s tests -p 'test_notebook_structure.py' -v && python -m unittest discover -s tests -p 'test_scoring_notebook.py' -v

  api-tests:
    name: Test experimental scoring API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run API tests
        run: python -m unittest discover -s tests -p 'test_api.py' -v

      - name: Test persisted model and FastAPI with a toy synthetic dataset
        run: python -m unittest discover -s tests -p 'test_model_workflow.py' -v

  docker-build:
    name: Build and smoke-test Docker image
    runs-on: ubuntu-latest
    needs: api-tests
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag bank-risk-scoring:ci .

      - name: Smoke test liveness and absent-model readiness
        run: |
          docker run -d --name bank-risk-api-ci -p 8000:8000 bank-risk-scoring:ci
          trap 'docker stop bank-risk-api-ci || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health/live; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health/live
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health/ready)
          test "$status" = "503"
