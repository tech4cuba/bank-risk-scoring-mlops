name: Drift Monitoring CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-monitoring:
    name: Test drift monitor and publish synthetic demo
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install drift-test dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3

      - name: Test numerical and categorical drift, missingness and CLI
        run: python -m unittest discover -s tests -p 'test_monitoring.py' -v

      - name: Generate synthetic demonstration report
        run: python -m examples.drift_demo --output-dir "$RUNNER_TEMP/drift-demo"

      - name: Publish clearly labeled demonstration summary
        run: |
          echo "## Synthetic drift demonstration (not live monitoring)" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/drift-demo/drift_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate demonstration reports
        uses: actions/upload-artifact@v4
        with:
          name: drift-demo-aggregate-report
          path: ${{ runner.temp }}/drift-demo/
          retention-days: 7
